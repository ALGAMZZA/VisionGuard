spring.application.name=visionguard
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/visionguard}
spring.datasource.username=${DB_USERNAME:visionguard}
spring.datasource.password=${DB_PASSWORD:visionguard}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.mvc.problemdetails.enabled=true
visionguard.ai.mode=${AI_MODE:mock}
visionguard.ai.base-url=${AI_BASE_URL:http://localhost:8000}
visionguard.ai.timeout-ms=${AI_TIMEOUT_MS:30000}
visionguard.events.max-gap-ms=${EVENT_MAX_GAP_MS:2000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.placeholders.instantType=DATETIME(6)
spring.flyway.placeholders.jsonTextType=LONGTEXT

visionguard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
server.port=8082
