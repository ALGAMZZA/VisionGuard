# Explicit opt-in local demo profile. Persistent and isolated from MySQL.
spring.datasource.url=jdbc:h2:file:./data/demo;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.placeholders.instantType=TIMESTAMP(6) WITH TIME ZONE
spring.flyway.placeholders.jsonTextType=CLOB
