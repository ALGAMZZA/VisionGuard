spring.datasource.url=jdbc:h2:mem:visionguard;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
visionguard.ai.mode=mock
visionguard.camera-id=camera-1
spring.mvc.problemdetails.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.placeholders.instantType=TIMESTAMP(6) WITH TIME ZONE
spring.flyway.placeholders.jsonTextType=CLOB
